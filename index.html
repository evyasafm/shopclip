<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Shopclip" />
  <title>Shopclip</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --paper: #f3eadc;
      --ink: #1a1612;
      --muted: #5c5348;
      --green: #1e4d38;
      --line: #d9cdb8;
      --card: #fffaf2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100dvh;
    }
    .screen { display: none; min-height: 100dvh; padding: calc(12px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
    .screen.on { display: flex; flex-direction: column; }
    .brand { text-align: center; font-weight: 800; font-size: 18px; letter-spacing: -0.03em; }
    .hint { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
    .stage {
      flex: 1; border-radius: 22px; overflow: hidden; background: #111;
      display: grid; place-items: center; position: relative;
    }
    .stage img, .stage video, .stage canvas { width: 100%; height: 100%; object-fit: cover; }
    .frame {
      position: absolute; inset: 18% 14%;
      border: 2px solid #fff; border-radius: 18px; pointer-events: none;
    }
    .dock { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 18px; }
    .shutter {
      width: 74px; height: 74px; border-radius: 50%;
      background: #fff; border: 6px solid #e8dfd0; appearance: none;
    }
    .ghost {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--line);
      display: grid; place-items: center; font-size: 18px;
    }
    h1 { font-size: 28px; margin: 8px 0 14px; letter-spacing: -0.04em; text-align: center; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
    input {
      width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
      background: #fff; font-size: 16px; font-family: inherit;
    }
    .btn {
      appearance: none; border: 0; width: 100%;
      background: var(--green); color: #f6f1e6; font-weight: 700;
      padding: 16px; border-radius: 14px; font-size: 17px; font-family: inherit; margin-top: 16px;
    }
    .btn.light { background: #fff; color: var(--ink); border: 1px solid var(--ink); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .photo { width: 100%; border-radius: 18px; object-fit: cover; max-height: 52dvh; }
    .spinwrap { flex: 1; display: grid; place-items: center; text-align: center; }
    .ring {
      width: 220px; height: 220px; border-radius: 50%;
      border: 6px solid #e4dac8; border-top-color: var(--green);
      animation: spin 1s linear infinite; display: grid; place-items: center; overflow: hidden;
    }
    .ring img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .player {
      flex: 1; border-radius: 22px; overflow: hidden; background: #111; position: relative;
    }
    .player img {
      width: 100%; height: 100%; object-fit: cover;
      animation: ken 8s ease-in-out forwards;
    }
    @keyframes ken {
      from { transform: scale(1) translateY(0); }
      to { transform: scale(1.12) translateY(-3%); }
    }
    .time {
      position: absolute; left: 14px; right: 14px; bottom: 14px;
      color: #fff; font-variant-numeric: tabular-nums; font-size: 13px;
      display: flex; justify-content: space-between;
    }
    .bar { position: absolute; left: 14px; right: 14px; bottom: 36px; height: 3px; background: #ffffff44; border-radius: 2px; }
    .bar > i { display: block; height: 100%; width: 0; background: #fff; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <input id="file" type="file" accept="image/*" capture="environment" />

  <section class="screen on" id="s-cam">
    <div class="brand">Shopclip</div>
    <div class="hint">Photograph the product</div>
    <div class="stage" id="live">
      <div style="color:#fff;padding:24px;text-align:center">Tap the shutter. On iPhone this opens the camera.</div>
      <div class="frame"></div>
    </div>
    <div class="dock">
      <button class="ghost" type="button" id="lib">▢</button>
      <button class="shutter" type="button" id="shutter" aria-label="Capture"></button>
      <div class="ghost">⟳</div>
    </div>
  </section>

  <section class="screen" id="s-ok">
    <h1>Looks good?</h1>
    <img class="photo" id="preview" alt="Product" />
    <label>Name (optional)</label>
    <input id="name" placeholder="Stoneware mug" />
    <label>Price (optional)</label>
    <input id="price" placeholder="$24" inputmode="decimal" />
    <button class="btn" id="make">Make clip</button>
    <button class="btn light" id="retake">Retake</button>
  </section>

  <section class="screen" id="s-load">
    <div class="spinwrap">
      <div class="ring"><img id="loadimg" alt="" /></div>
      <h1>Making your clip</h1>
      <p class="hint">Usually 20 seconds</p>
    </div>
  </section>

  <section class="screen" id="s-out">
    <div class="brand">Shopclip</div>
    <div class="hint">Ready for TikTok Shop, Reels, Etsy</div>
    <div class="player">
      <img id="clip" alt="Clip" />
      <div class="bar"><i id="fill"></i></div>
      <div class="time"><span id="t0">0:00</span><span>0:08</span></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="share">Share clip</button>
      <button class="btn light" id="again">New</button>
    </div>
  </section>

<script>
const $ = (id) => document.getElementById(id);
const show = (id) => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $(id).classList.add('on');
};
let blobUrl = '';
const file = $('file');
const pick = () => file.click();
$('shutter').onclick = pick;
$('lib').onclick = pick;
$('retake').onclick = () => show('s-cam');
$('again').onclick = () => show('s-cam');
file.onchange = () => {
  const f = file.files && file.files[0];
  if (!f) return;
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(f);
  $('preview').src = blobUrl;
  $('loadimg').src = blobUrl;
  $('clip').src = blobUrl;
  show('s-ok');
};
$('make').onclick = () => {
  show('s-load');
  setTimeout(() => {
    show('s-out');
    const fill = $('fill');
    const t0 = $('t0');
    fill.style.width = '0%';
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / 8000);
      fill.style.width = (p * 100) + '%';
      t0.textContent = '0:0' + Math.min(8, Math.floor(p * 8));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, 2200);
};
$('share').onclick = async () => {
  const title = $('name').value || 'Shopclip';
  if (navigator.share) {
    try { await navigator.share({ title, text: 'Product clip from Shopclip' }); } catch (e) {}
  } else {
    alert('On iPhone: Share from Safari, or Add to Home Screen.');
  }
};
</script>
</body>
</html>
